############################################
# ⏰ UTC → PHT Conversion Table
# | UTC Time | PHT Time         | Notes    |
# | -------- | ---------------- | -------- |
# | 00:00    | 08:00            | Morning  |
# | 01:00    | 09:00            |          |
# | 02:00    | 10:00            |          |
# | 03:00    | 11:00            |          |
# | 04:00    | 12:00            | Noon     |
# | 05:00    | 13:00            |          |
# | 06:00    | 14:00            |          |
# | 07:00    | 15:00            |          |
# | 08:00    | 16:00            |          |
# | 09:00    | 17:00            |          |
# | 10:00    | 18:00            |          |
# | 11:00    | 19:00            |          |
# | 12:00    | 20:00            | Evening  |
# | 13:00    | 21:00            |          |
# | 14:00    | 22:00            |          |
# | 15:00    | 23:00            |          |
# | 16:00    | 00:00 (next day) | Midnight |
# | 17:00    | 01:00 (next day) |          |
# | 18:00    | 02:00 (next day) |          |
# | 19:00    | 03:00 (next day) |          |
# | 20:00    | 04:00 (next day) |          |
# | 21:00    | 05:00 (next day) |          |
# | 22:00    | 06:00 (next day) |          |
# | 23:00    | 07:00 (next day) |          |
############################################

###########################################################
#            on.schedule cron format                      #
#  ┌───────────── minute (0 - 59)                         #
#  │ ┌───────────── hour (0 - 23)                         #
#  │ │ ┌───────────── day of month (1 - 31)               #
#  │ │ │ ┌───────────── month (1 - 12)                    #
#  │ │ │ │ ┌───────────── day of week (0 - 6, 0=Sunday)   #
#  │ │ │ │ │                                              #
#  │ │ │ │ │                                              #
#  * * * * *                                              #
###########################################################

name: Scheduled Lighthouse Reports

permissions:
  contents: write  # allow pushing commits

on:
  #schedule:
    # run every weekends at 9:35 AM PHT
    # 1:35 AM UTC = 9:35 AM PHT
    # added 25 mins queue on schedule
    #- cron: "35 1 * * 0"
    #- cron: "35 1 * * 6"
    # Add holiday runs here
    #- cron: "* * * * *"
  workflow_dispatch:      # allow manual run

jobs:
  run-lighthouse:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Manila

    # Restrict workflow to only run when the branch is main
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: main
          
      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '20'

      # Cache Node.js dependencies
      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      # Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Lighthouse automation
        run: |
          for i in 1 2 3; do
            echo "Running Lighthouse attempt $i..."
            npm run all:lighthouse && break
            sleep 10
          done

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Save reports temporarily
        run: |
          mkdir -p /tmp/lighthouse-reports
          cp -r reports/* /tmp/lighthouse-reports/
      
      # ----------------------------------
      # Update auto-daily-report (history)
      # ----------------------------------
        
      - name: Commit & push to auto-daily-report
        run: |
          # Fetch remote branch if it exists
          git fetch origin auto-daily-report || true
          
          # Switch to auto-daily-report (create if missing)
          if git rev-parse --verify origin/auto-daily-report >/dev/null 2>&1; then
            git checkout auto-daily-report
          else
            git checkout --orphan auto-daily-report
          fi

          # 🧹 Cleanup: remove everything except reports/ and .git
          # 1. Remove tracked files except reports/
          git ls-files | grep -v '^reports/' | xargs -r git rm -rf --ignore-unmatch

          # 2. Remove untracked files/folders except reports/
          # -f = force
          # -d = recurse into dirs
          # -x = remove ignored files too
          # -e reports = exclude reports/
          git clean -fdx -e reports

          # 3. Remove untracked files/folders except reports/ and .git (safety net)
          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name "reports" -exec rm -rf {} +

          # Ensure reports folder exists in auto-daily-report
          mkdir -p reports
          
          # Copy reports from main into auto-daily-report/reports (append mode)
          cp -r /tmp/lighthouse-reports/* ./reports/

          # Stage all updates
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "chore(reports): cleanup & update Lighthouse reports"
            git push -f origin auto-daily-report
          else
            echo "No changes in reports — skipping commit."
          fi

      # ------------------------------------------
      # Update current-day-report (fresh snapshot)
      # ------------------------------------------
      - name: Commit & push to current-day-report
        run: |
          # Go back to main to fetch newest reports
          git checkout main
          
          git fetch origin current-day-report || true

          if git rev-parse --verify origin/current-day-report >/dev/null 2>&1; then
            git checkout current-day-report
          else
            git checkout --orphan current-day-report
          fi

          # 🧹 Cleanup: remove everything except .git
          # 1. Remove tracked files except .git
          git ls-files | xargs -r git rm -rf --ignore-unmatch

          # 2. Remove untracked files/folders
          # -f = force
          # -d = recurse into dirs
          # -x = remove ignored files too
          git clean -fdx

          # 3. Remove untracked files/folders except .git (safety net)
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          # Create reports folder if it doesn't exist
          mkdir -p reports

          # Copy fresh reports directly from the workflow workspace
          cp -r /tmp/lighthouse-reports/* ./reports/

          # Stage all updates
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "chore(reports): update today's Lighthouse report"
            git push -f origin current-day-report
          else
            echo "No changes for current-day-report — skipping commit."
          fi

      # Upload reports as GitHub artifact (keeps history per run)
      - name: Upload Lighthouse reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.run_id }}-${{ github.run_number }}
          path: reports/
          retention-days: 30
